name: Terraform Main Deployment
permissions: read-all # Allow the workflow to read the repository's content
on:
  push:
    branches:
      - main
jobs:
  terraform-deploy:
    runs-on: ubuntu-latest

    # Set default working directory for all 'run' commands in this job
    defaults:
      run:
        working-directory: ./terraform/
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_custom_domain: ${{ secrets.TF_VAR_CUSTOM_DOMAIN }}
      TF_VAR_contact: ${{ secrets.TF_VAR_CONTACT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
        if: github.ref == 'refs/heads/main'

      - name: Get Static Web App deployment token
        id: static-web-app-token
        run: |
          echo "token=$(az staticwebapp secrets list \
            --name "$(terraform output -raw static_web_app_name)" \
            --resource-group "$TF_VAR_rg_name" \
            --query properties.apiKey \
            --output tsv)" >> "$GITHUB_OUTPUT"
        env:
          TF_VAR_rg_name: profile

      - name: Deploy website
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.static-web-app-token.outputs.token }}
          app_location: ./html
          skip_app_build: true

      - name: Azure Logout
        run: |
          if az account show >/dev/null 2>&1; then
            az logout
          fi
        if: always() # Ensure this runs even if previous steps fail, to clean up credentials
