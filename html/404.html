<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080911">
  <title>404 — Page not found | Teemu Suvanto</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f5fa;
      --muted: #a2a4b8;
      --violet: #9e78ff;
      --cyan: #6ce8f0;
      --bg: #080911;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100svh;
      place-items: center;
      margin: 0;
      padding: 24px;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 30%, rgba(111, 82, 224, .2), transparent 32rem),
        radial-gradient(ellipse at 90% 90%, rgba(36, 187, 213, .09), transparent 28rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      position: relative;
      width: min(100%, 680px);
      padding: clamp(32px, 8vw, 70px);
      overflow: hidden;
      border: 1px solid rgba(211, 212, 248, .14);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(24, 25, 42, .92), rgba(12, 13, 22, .95));
      box-shadow: inset 0 1px rgba(255,255,255,.08), 0 30px 90px rgba(0,0,0,.38);
      text-align: center;
    }

    main::before {
      position: absolute;
      top: -110px;
      left: 50%;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(189, 156, 255, .2);
      border-radius: 50%;
      box-shadow: 0 0 0 24px rgba(158, 120, 255, .035), 0 0 0 52px rgba(108, 232, 240, .025);
      content: "";
      transform: translateX(-50%);
    }

    .eyebrow {
      position: relative;
      color: #c9baff;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      margin: 16px 0 8px;
      background: linear-gradient(105deg, #f8f5ff 4%, #c8a8ff 50%, #71e8ed 94%);
      background-clip: text;
      color: transparent;
      font-size: clamp(6rem, 24vw, 10rem);
      font-weight: 730;
      letter-spacing: -.1em;
      line-height: .95;
      -webkit-background-clip: text;
    }

    p {
      position: relative;
      max-width: 400px;
      margin: 18px auto 28px;
      color: var(--muted);
      line-height: 1.8;
    }

    a {
      position: relative;
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      gap: 9px;
      padding: 0 18px;
      border: 1px solid rgba(189, 156, 255, .4);
      border-radius: 13px;
      background: linear-gradient(110deg, #b394ff, #8b75f2 60%, #60d9e9);
      box-shadow: 0 9px 28px rgba(139, 117, 242, .22), inset 0 1px rgba(255,255,255,.38);
      color: #0b0a14;
      font-size: .83rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    a:hover {
      box-shadow: 0 12px 34px rgba(139, 117, 242, .35);
      transform: translateY(-2px);
    }

    a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 5px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Looks like this route drifted</span>
    <h1>404</h1>
    <p>The page you're looking for isn't here. Let's get you back to the main site.</p>
    <a href="/">Return home <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
